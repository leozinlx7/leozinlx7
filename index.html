<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área Secreta</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:'Playfair Display',serif;
background: radial-gradient(circle at center,#001f4d,#000814,#000000);
color:white;
overflow:hidden;
}

.milkyway{
position:fixed;
width:200%;
height:200%;
background: radial-gradient(ellipse at center, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 30%, transparent 60%);
transform:rotate(-25deg);
top:-50%;
left:-50%;
z-index:0;
pointer-events:none;
animation:moveGalaxy 120s linear infinite;
}

@keyframes moveGalaxy{
0%{transform:rotate(-25deg) translateX(0)}
100%{transform:rotate(-25deg) translateX(200px)}
}

.star{
position:fixed;
width:2px;
height:2px;
background:white;
border-radius:50%;
opacity:0.8;
animation:twinkle 2s infinite alternate;
z-index:0;
}

@keyframes twinkle{
0%{opacity:0.2;transform:scale(1)}
100%{opacity:1;transform:scale(1.8)}
}

.shootingStar{
position:fixed;
width:200px;
height:2px;
background:linear-gradient(90deg,rgba(255,255,255,1),rgba(255,255,255,0));
border-radius:50%;
opacity:0;
z-index:1;
pointer-events:none;
}

@keyframes shoot{
0%{
transform:translate(-300px,-300px) rotate(45deg);
opacity:0;
}
10%{opacity:1;}
80%{opacity:1;}
100%{
transform:translate(120vw,120vh) rotate(45deg);
opacity:0;
}
}

.login{
background:#111;
padding:40px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,0.8);
text-align:center;
z-index:3;
max-width:320px;
}

input{
display:block;
margin:10px auto;
padding:10px;
border-radius:8px;
border:none;
width:200px;
background:#2b2b2b;
color:white;
}

button{
padding:10px 25px;
border:none;
border-radius:8px;
background:#555;
color:white;
cursor:pointer;
}

.riddle{
font-size:14px;
opacity:0.85;
margin-top:10px;
line-height:1.5;
}

.surpresa{
display:none;
position:absolute;
width:100%;
height:100%;
top:0;
left:0;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
z-index:2;
}

#texto{
font-size:28px;
max-width:750px;
line-height:1.6;
padding:20px;
max-height:60vh;
overflow-y:auto;
}

.final{
font-size:36px;
margin-top:40px;
opacity:0;
transform:scale(0.7);
transition:all 1.5s;
padding:20px;
}

.final.show{
opacity:1;
transform:scale(1.1);
}

@media (max-width:600px){

#texto{
font-size:20px;
}

.final{
font-size:24px;
}

}

.heart{
position:fixed;
top:-20px;
font-size:30px;
color:rgba(255,0,0,0.5);
animation:fall linear infinite;
z-index:1;
}

@keyframes fall{
0%{transform:translateY(-20px)}
100%{transform:translateY(110vh)}
}

.particle{
position:absolute;
width:3px;
height:3px;
background:#4da6ff;
border-radius:50%;
opacity:0.8;
animation:float 10s linear infinite;
z-index:0;
}

@keyframes float{
0%{transform:translateY(100vh)}
100%{transform:translateY(-10vh)}
}

</style>
</head>

<body>

<div class="milkyway"></div>

<div class="login" id="login">

<h2>🔒 Área Secreta</h2>

<input id="user" placeholder="Usuário">

<div class="riddle">
🎸 Charada:<br>
Um herói 🕸️ aprendeu aprendeu a maior lição da sua vida.<br>
sera q vc acerta??
</div>

<input id="pass" type="password" placeholder="Senha">

<button onclick="entrar()">Entrar</button>

</div>

<div class="surpresa" id="surpresa">

<div id="texto"></div>

<div class="final" id="final">
dizem que perfeição não existe...<br><br>
mas acho que ainda não te conheceram.<br>
te adoroo, Ana ❤️
</div>

<audio id="musica">
<source src="musica.mp3" type="audio/mpeg">
</audio>

</div>

<script>

const mensagem = `

Hoje é o Dia das Mulheres,
e eu não podia deixar passar
sem falar de você.

Entre tantas pessoas no mundo,
você tem um jeito único
que chama atenção sem esforço.

Tem algo na sua forma de ser
que mistura leveza, força
e uma simplicidade bonita
que é difícil de explicar…
mas fácil de admirar.

Você é o tipo de pessoa
que torna os dias mais interessantes
só por existir.

Seu jeito, suas palavras,
sua presença…
tudo em você tem algo especial.

Eu gosto muito de você,
de verdade.

Não só pelo que você mostra,
mas pelo que você é.

E é impossível não reconhecer
o quanto você é especial
e única.

Então hoje eu só queria te desejar
um Feliz Dia das Mulheres.

Que você continue sendo
exatamente essa pessoa maravilhosa,
cheia de luz e coisas bonitas
que fazem diferença na vida
de quem tem a sorte de te conhecer.

🌸 Feliz Dia das Mulheres 🌸
`

function entrar(){

let user=document.getElementById("user").value
let pass=document.getElementById("pass").value

if(user=="mo do leo" && pass=="com grandes poderes vem grandes responsabilidades"){

document.getElementById("login").style.display="none"
document.getElementById("surpresa").style.display="flex"

let musica=document.getElementById("musica")
musica.play()

digitarTexto()

}else{

alert("Usuário ou senha incorretos ❤️")

}

}

function digitarTexto(){

let i=0
let speed=45
let texto=document.getElementById("texto")

function escrever(){

if(i<mensagem.length){

texto.innerHTML+=mensagem.charAt(i)
i++

setTimeout(escrever,speed)

}else{

document.getElementById("final").classList.add("show")
chuvaDeEstrelas()

}

}

escrever()

}

function coracoes(){

const simbolos=["❤","🌹"]

setInterval(()=>{

let heart=document.createElement("div")

heart.classList.add("heart")

heart.innerHTML=simbolos[Math.floor(Math.random()*simbolos.length)]

heart.style.left=Math.random()*100+"vw"
heart.style.animationDuration=(Math.random()*5+4)+"s"

document.body.appendChild(heart)

setTimeout(()=>{heart.remove()},8000)

},400)

}

coracoes()

function particulas(){

for(let i=0;i<80;i++){

let p=document.createElement("div")

p.classList.add("particle")

p.style.left=Math.random()*100+"vw"
p.style.animationDuration=(Math.random()*10+5)+"s"

document.body.appendChild(p)

}

}

particulas()

function estrelas(){

for(let i=0;i<150;i++){

let star=document.createElement("div")

star.classList.add("star")

star.style.left=Math.random()*100+"vw"
star.style.top=Math.random()*100+"vh"

star.style.animationDuration=(Math.random()*3+1)+"s"

document.body.appendChild(star)

}

}

estrelas()

function estrelaCadente(){

setInterval(()=>{

let s=document.createElement("div")

s.classList.add("shootingStar")

s.style.top=Math.random()*40+"vh"
s.style.left=Math.random()*40+"vw"

s.style.animation="shoot 2s linear"

document.body.appendChild(s)

setTimeout(()=>{s.remove()},2000)

},9000)

}

estrelaCadente()

function chuvaDeEstrelas(){

for(let i=0;i<15;i++){

setTimeout(()=>{

let s=document.createElement("div")

s.classList.add("shootingStar")

s.style.top=Math.random()*30+"vh"
s.style.left=Math.random()*30+"vw"

s.style.animation="shoot 2s linear"

document.body.appendChild(s)

setTimeout(()=>{s.remove()},2000)

},i*300)

}

}

</script>

</body>
</html>
